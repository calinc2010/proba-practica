<div class="invoice-upload">
  <h2>Incarca Factura</h2>

  <input
    type="file"
    accept="application/pdf"
    (change)="onFileSelected($event)"
  />

  <table
    mat-table
    [dataSource]="invoiceLines"
    class="mat-elevation-z8 invoice-table"
  >
    <ng-container matColumnDef="productCode">
      <th mat-header-cell *matHeaderCellDef>Cod produs</th>
      <td mat-cell *matCellDef="let line">{{ line.productCode }}</td>
    </ng-container>

    <ng-container matColumnDef="productName">
      <th mat-header-cell *matHeaderCellDef>Denumire produs</th>
      <td mat-cell *matCellDef="let line">{{ line.productName }}</td>
    </ng-container>

    <ng-container matColumnDef="unitPrice">
      <th mat-header-cell *matHeaderCellDef>Pret unitar</th>
      <td mat-cell *matCellDef="let line">{{ line.unitPrice }}</td>
    </ng-container>

    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef>Moneda</th>
      <td mat-cell *matCellDef="let line">{{ line.currency }}</td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Cantitate</th>
      <td mat-cell *matCellDef="let line">{{ line.quantity }}</td>
    </ng-container>

    <ng-container matColumnDef="export">
      <th mat-header-cell *matHeaderCellDef>Export</th>
      <td mat-cell *matCellDef="let line">
        <button
          mat-button
          color="primary"
          [disabled]="invoiceLines.length === 0"
          (click)="exportCsv()"
        >
          Export CSV
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
